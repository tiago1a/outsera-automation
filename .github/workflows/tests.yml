name: Cypress Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ============================================
  # Testes de API (JSONPlaceholder)
  # ============================================
  api-tests:
    runs-on: ubuntu-latest
    container: cypress/included:15.9.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: |
          npx cypress run \
            --config-file cypress.api.config.js \
            --spec "cypress/e2e/api/**/*.cy.js"

      - name: Upload API test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: cypress/reports

      - name: Upload API screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-screenshots
          path: cypress/screenshots

  # ============================================
  # Testes E2E (SauceDemo com Cucumber)
  # ============================================
  e2e-tests:
    runs-on: ubuntu-latest
    container: cypress/included:15.9.0

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Run E2E tests
        run: |
          npx cypress run \
            --config-file cypress.config.js \
            --spec "cypress/e2e/features/**/*.feature"

      - name: Upload E2E test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-reports
          path: reports

      - name: Upload E2E screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: cypress/screenshots

      - name: Upload E2E videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-videos
          path: cypress/videos

